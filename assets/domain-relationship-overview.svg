<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cherub four-domain relationship overview</title><desc id="desc">An original four-panel study diagram for governance, risk management, security program, and incident management.</desc>
  <rect width="1200" height="760" fill="#f6f9fe"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173151">Cherub relationship overview</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="16" fill="#53667f">Original study visual. Domain scope aligned to the ISACA CISM content outline.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(60 145)"><rect width="520" height="250" rx="18" fill="#edf5ff" stroke="#78a8ee"/><text x="24" y="38" font-size="22" font-weight="700" fill="#1757ad">D1 Governance</text><text x="24" y="75" font-size="16" fill="#173151">Business objective</text><text x="190" y="75" font-size="22" fill="#2f72e6">→</text><text x="220" y="75" font-size="16" fill="#173151">Authority</text><text x="335" y="75" font-size="22" fill="#2f72e6">→</text><text x="365" y="75" font-size="16" fill="#173151">Strategy</text><text x="24" y="132" font-size="16" fill="#173151">Strategy</text><text x="115" y="132" font-size="22" fill="#2f72e6">→</text><text x="145" y="132" font-size="16" fill="#173151">Metrics</text><text x="245" y="132" font-size="22" fill="#2f72e6">→</text><text x="275" y="132" font-size="16" fill="#173151">Leadership decision</text><text x="24" y="205" font-size="14" fill="#53667f">Question lens: accountable owner and business alignment.</text></g>
  <g transform="translate(620 145)"><rect width="520" height="250" rx="18" fill="#effbf4" stroke="#7dc99c"/><text x="24" y="38" font-size="22" font-weight="700" fill="#157a45">D2 Risk Management</text><text x="24" y="75" font-size="16" fill="#173151">Threat / weakness</text><text x="175" y="75" font-size="22" fill="#2eb06a">→</text><text x="205" y="75" font-size="16" fill="#173151">Assess</text><text x="290" y="75" font-size="22" fill="#2eb06a">→</text><text x="320" y="75" font-size="16" fill="#173151">Treat</text><text x="24" y="132" font-size="16" fill="#173151">Residual risk</text><text x="145" y="132" font-size="22" fill="#2eb06a">→</text><text x="175" y="132" font-size="16" fill="#173151">Risk owner</text><text x="290" y="132" font-size="22" fill="#2eb06a">→</text><text x="320" y="132" font-size="16" fill="#173151">Reassess</text><text x="24" y="205" font-size="14" fill="#53667f">Question lens: evidence, treatment, and accountable acceptance.</text></g>
  <g transform="translate(60 445)"><rect width="520" height="250" rx="18" fill="#f6efff" stroke="#b895e8"/><text x="24" y="38" font-size="22" font-weight="700" fill="#7439bc">D3 Security Program</text><text x="24" y="75" font-size="16" fill="#173151">Requirement</text><text x="135" y="75" font-size="22" fill="#8b42d3">→</text><text x="165" y="75" font-size="16" fill="#173151">Design</text><text x="245" y="75" font-size="22" fill="#8b42d3">→</text><text x="275" y="75" font-size="16" fill="#173151">Operate</text><text x="24" y="132" font-size="16" fill="#173151">Evidence</text><text x="110" y="132" font-size="22" fill="#8b42d3">→</text><text x="140" y="132" font-size="16" fill="#173151">Effectiveness</text><text x="270" y="132" font-size="22" fill="#8b42d3">→</text><text x="300" y="132" font-size="16" fill="#173151">Metric</text><text x="24" y="205" font-size="14" fill="#53667f">Question lens: design, operation, proof, then outcome.</text></g>
  <g transform="translate(620 445)"><rect width="520" height="250" rx="18" fill="#fff5e9" stroke="#efb76e"/><text x="24" y="38" font-size="22" font-weight="700" fill="#b66208">D4 Incident Management</text><text x="24" y="75" font-size="16" fill="#173151">BIA</text><text x="65" y="75" font-size="22" fill="#e4770d">→</text><text x="95" y="75" font-size="16" fill="#173151">RTO / RPO</text><text x="205" y="75" font-size="22" fill="#e4770d">→</text><text x="235" y="75" font-size="16" fill="#173151">Strategy</text><text x="24" y="132" font-size="16" fill="#173151">Plan + test</text><text x="125" y="132" font-size="22" fill="#e4770d">→</text><text x="155" y="132" font-size="16" fill="#173151">Correct</text><text x="240" y="132" font-size="22" fill="#e4770d">→</text><text x="270" y="132" font-size="16" fill="#173151">Retest</text><text x="24" y="205" font-size="14" fill="#53667f">Question lens: establish readiness and objectives before acting.</text></g></g>
</svg>
