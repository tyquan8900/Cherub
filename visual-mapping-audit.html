<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cherub visual audit</title><style>body{margin:0;background:#f4f7fb;color:#122b4d;font:15px system-ui}.wrap{max-width:1500px;margin:auto;padding:28px}.note{color:#526b8c}.domain{background:#fff;border:1px solid #d8e4f2;border-radius:14px;padding:16px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.map{border:1px solid #d8e4f2;border-radius:12px;padding:12px}.map h3{margin:0 0 5px}.flag{color:#9d3f08;font-weight:700;font-size:12px}.mini{display:block;width:100%;border:1px solid #dce6f3;border-radius:10px;background:#f8fbff;margin-top:8px}.links{display:grid;gap:6px;margin-top:10px}.links a{padding:7px 8px;border:1px solid #bdd1eb;border-radius:7px;color:#1764c0;font-weight:700;text-decoration:none;font-size:12px}.source{font-size:12px;color:#526b8c}.source a{color:#1764c0}</style><main class="wrap"><h1>Cherub visual-map audit</h1><p class="note">Each Index concept has an original Cherub visual thumbnail. Open any blue row for its full diagram. Reference sources are separate links; no external image is copied into Cherub.</p><div id="audit">Loading 80 concepts…</div></main><script>
const direct={"Risk appetite":["Risk capacity","Risk tolerance","Risk criteria"],"Risk tolerance":["Risk appetite","Risk criteria","Risk acceptance"],"Residual risk":["Control effectiveness","Risk owner","Risk treatment"],"Control effectiveness":["Control design","Control operation","Control evidence","Residual risk"],"BIA":["RTO","RPO","Recovery strategy","Business continuity plan"],"RTO":["BIA","RPO","Recovery strategy","Recovery testing"],"RPO":["BIA","RTO","Recovery strategy","Disaster recovery plan"],"Incident response plan":["Incident readiness","Incident classification","Containment","Post-incident review"],"Business objectives":["Security strategy","Governance framework","Executive reporting"],"Security strategy":["Business objectives","Policies","Security metrics"],"Risk assessment":["Risk analysis","Risk criteria","Risk treatment","Risk register"],"Recovery strategy":["BIA","RTO","RPO","Recovery testing"]};
const refs={D1:{name:'Governance',source:'COBIT 2019 governance framework',url:'https://www.linkedin.com/pulse/introduction-cobit-2019-framework-effective-governance-n4oce',a:['Business-objective alignment','Decision rights & accountability','Leadership metrics']},D2:{name:'Risk Management',source:'NIST SP 800-30 Rev. 1',url:'https://csrc.nist.gov/pubs/sp/800/30/r1/final',a:['Risk register & treatment','Inherent to residual risk','Risk trend & reassessment']},D3:{name:'Information Security Program',source:'ISO/IEC 27001 ISMS cycle',url:'https://www.iso.org/standard/27001',a:['Control design to evidence','Control effectiveness','Program metrics']},D4:{name:'Incident Management',source:'NIST SP 800-61 Rev. 2',url:'https://csrc.nist.gov/pubs/sp/800/61/r2/final',a:['BIA / dependency','RTO / RPO objectives','Recovery test & correction']}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mini(t,r){const n=[t,...r.slice(0,2)],x=[16,150,284],f=['#dcecff','#eee7ff','#dff6e5'];return `<svg class="mini" viewBox="0 0 420 145"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2876d2"/></marker></defs><text x="16" y="23" font-size="13" font-family="system-ui" font-weight="800" fill="#17365f">${esc(t)}</text>${n.map((v,i)=>`<g><rect x="${x[i]}" y="52" width="120" height="52" rx="11" fill="${f[i]}" stroke="#3975cd"/><text x="${x[i]+60}" y="82" text-anchor="middle" font-size="11" font-family="system-ui" font-weight="700" fill="#16385f">${esc(v).slice(0,19)}</text>${i<2?`<path d="M ${x[i]+120} 78 L ${x[i+1]-8} 78" stroke="#2876d2" stroke-width="3" marker-end="url(#a)"/>`:''}</g>`).join('')}</svg>`}
fetch('data/concepts.json').then(r=>r.json()).then(data=>{const root=document.getElementById('audit');root.innerHTML='';Object.entries(data).forEach(([domain,terms])=>{const d=refs[domain],s=document.createElement('section');s.className='domain';s.innerHTML=`<h2>${domain} · ${d.name} (${terms.length})</h2><div class="grid">${terms.map(t=>{const p=terms.indexOf(t),near=[terms[p-2],terms[p-1],terms[p+1],terms[p+2]].filter(Boolean),named=direct[t]||[],rel=[...new Set([...named,...near.filter(x=>!named.includes(x))])].slice(0,5),kind=named.length?'named relationship':'Index-neighbor fallback',actions=d.a.map((a,i)=>`<a href="visual-aid.html?domain=${encodeURIComponent(domain)}&concept=${encodeURIComponent(t)}&aid=${encodeURIComponent(a)}&variant=${i}">Open: ${a} →</a>`).join('');return `<article class="map"><h3>${esc(t)}</h3><span class="flag">${kind}</span>${mini(t,rel)}<div class="links">${actions}</div><p class="source"><b>Reference:</b> <a target="_blank" rel="noopener" href="${d.url}">${d.source} ↗</a></p></article>`}).join('')}</div>`;root.append(s)})});
</script>
