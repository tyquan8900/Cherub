<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cherub visual-map audit</title>
<style>body{margin:0;background:#f4f7fb;color:#122b4d;font:15px system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}h1{margin:0 0 6px}.note{color:#526b8c}.domain{background:#fff;border:1px solid #d8e4f2;border-radius:14px;padding:16px;margin:22px 0}.domain h2{margin:0 0 5px}table{width:100%;border-collapse:collapse;margin-top:13px;font-size:13px}th,td{padding:10px;border:1px solid #d9e4f1;text-align:left;vertical-align:top}th{background:#eaf3ff}tr:nth-child(even){background:#f9fbfe}.flow{font-weight:650;color:#214e87}.flag{color:#9d3f08;font-weight:700}.source a{color:#1764c0}.count{display:inline-block;padding:3px 8px;border-radius:99px;background:#dfeeff;font-weight:700}</style></head>
<body><main class="wrap"><h1>Cherub visual-map audit</h1><p class="note">This is a review screen—not a lesson. It shows the current proposed route for every Index concept before the diagrams are finalized. A row is <span class="flag">needs review</span> when it relies on Index-neighbor mapping instead of a named relationship.</p><div id="audit">Loading 80 concepts…</div></main>
<script>
const direct={"Risk appetite":["Risk capacity","Risk tolerance","Risk criteria"],"Risk tolerance":["Risk appetite","Risk criteria","Risk acceptance"],"Residual risk":["Control effectiveness","Risk owner","Risk treatment"],"Control effectiveness":["Control design","Control operation","Control evidence","Residual risk"],"BIA":["RTO","RPO","Recovery strategy","Business continuity plan"],"RTO":["BIA","RPO","Recovery strategy","Recovery testing"],"RPO":["BIA","RTO","Recovery strategy","Disaster recovery plan"],"Incident response plan":["Incident readiness","Incident classification","Containment","Post-incident review"],"Business objectives":["Security strategy","Governance framework","Executive reporting"],"Security strategy":["Business objectives","Policies","Security metrics"],"Risk assessment":["Risk analysis","Risk criteria","Risk treatment","Risk register"],"Recovery strategy":["BIA","RTO","RPO","Recovery testing"]};
const refs={D1:{name:'Governance',source:'COBIT 2019 structural governance framework',url:'https://www.linkedin.com/pulse/introduction-cobit-2019-framework-effective-governance-n4oce',a:['Business-objective alignment table','Decision-rights and accountability diagram','Leadership metrics trend chart']},D2:{name:'Risk Management',source:'NIST SP 800-30 Rev. 1',url:'https://csrc.nist.gov/pubs/sp/800/30/r1/final',a:['Risk register and treatment table','Inherent-to-residual risk comparison chart','Risk trend and reassessment dashboard']},D3:{name:'Information Security Program',source:'ISO/IEC 27001 ISMS cycle + CIS Controls',url:'https://www.iso.org/standard/27001',a:['Control design-to-evidence table','Control effectiveness test-results chart','Program metrics trend dashboard']},D4:{name:'Incident Management',source:'NIST SP 800-61 Rev. 2 + Ready.gov BIA',url:'https://csrc.nist.gov/pubs/sp/800/61/r2/final',a:['BIA impact and dependency table','RTO/RPO recovery-objective matrix','Recovery-test results and deficiency trend chart']}};
fetch('data/concepts.json').then(r=>r.json()).then(data=>{const root=document.getElementById('audit');root.innerHTML='';Object.entries(data).forEach(([domain,terms])=>{const d=refs[domain];const section=document.createElement('section');section.className='domain';const rows=terms.map(term=>{const p=terms.indexOf(term),near=[terms[p-2],terms[p-1],terms[p+1],terms[p+2]].filter(Boolean),named=direct[term]||[],related=[...new Set([...named,...near.filter(x=>!named.includes(x))])].slice(0,5),kind=named.length?'named relationship':'Index-neighbor fallback';const flows=d.a.map((aid,i)=>{const path=[term,aid,...related.slice(i).concat(related.slice(0,i)).slice(0,2)].join(' → '),href=`visual-aid.html?domain=${encodeURIComponent(domain)}&concept=${encodeURIComponent(term)}&aid=${encodeURIComponent(aid)}&variant=${i}`;return `<a href="${href}">• ${path} ↗</a>`});return `<tr><td><b>${term}</b><br><span class="flag">${kind}</span></td><td>${related.join(' → ')||'No mapping yet'}</td><td class="flow">${flows.join('<br>')}</td><td class="source"><a target="_blank" rel="noopener" href="${d.url}">${d.source} ↗</a></td></tr>`}).join('');section.innerHTML=`<h2>${domain} · ${d.name} <span class="count">${terms.length} concepts</span></h2><table><thead><tr><th>Index concept / mapping type</th><th>Connected terms now used</th><th>Three clickable proposed diagrams</th><th>Domain visual source</th></tr></thead><tbody>${rows}</tbody></table>`;root.append(section)})}).catch(()=>document.getElementById('audit').textContent='Could not load the concept data.');
</script></body></html>
