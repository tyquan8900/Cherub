<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cherub visual aid</title><style>body{margin:0;background:#f4f7fb;color:#122b4d;font:16px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #d8e4f2;border-radius:14px;padding:20px}.tiny{color:#526b8c;font-size:14px}a{color:#1764c0;font-weight:700}svg{display:block;width:100%;min-width:720px;background:linear-gradient(135deg,#f9fcff,#f1edff);border:1px solid #d8e4f2;border-radius:14px}figure{margin:18px 0}img{display:block;width:min(100%,660px);margin:auto;border:1px solid #d8e4f2;border-radius:12px}</style></head><body><main class="wrap"><p><a href="visual-mapping-audit.html">← Back to the mapping audit</a></p><section class="card" id="app">Loading visual aid…</section></main><script>
const q=new URLSearchParams(location.search),concept=q.get('concept')||'Concept',aid=q.get('aid')||'Visual aid',domain=q.get('domain')||'D1';
const sources={D1:['COBIT 2019 structural governance framework','https://www.linkedin.com/pulse/introduction-cobit-2019-framework-effective-governance-n4oce'],D2:['NIST SP 800-30 Rev. 1 risk methodology','https://csrc.nist.gov/pubs/sp/800/30/r1/final'],D3:['ISO/IEC 27001 ISMS operational cycle','https://www.iso.org/standard/27001'],D4:['NIST SP 800-61 Rev. 2 incident-handling phases','https://csrc.nist.gov/pubs/sp/800/61/r2/final']};
const direct={"Risk appetite":["Risk capacity","Risk tolerance","Risk criteria"],"Risk tolerance":["Risk appetite","Risk criteria","Risk acceptance"],"Residual risk":["Control effectiveness","Risk owner","Risk treatment"],"Control effectiveness":["Control design","Control operation","Control evidence","Residual risk"],"BIA":["RTO","RPO","Recovery strategy","Business continuity plan"],"RTO":["BIA","RPO","Recovery strategy","Recovery testing"],"RPO":["BIA","RTO","Recovery strategy","Disaster recovery plan"],"Incident response plan":["Incident readiness","Incident classification","Containment","Post-incident review"],"Business objectives":["Security strategy","Governance framework","Executive reporting"],"Security strategy":["Business objectives","Policies","Security metrics"],"Risk assessment":["Risk analysis","Risk criteria","Risk treatment","Risk register"],"Recovery strategy":["BIA","RTO","RPO","Recovery testing"]};
fetch('data/concepts.json').then(r=>r.json()).then(data=>{const terms=data[domain]||[],at=terms.indexOf(concept),near=[terms[at-2],terms[at-1],terms[at+1],terms[at+2]].filter(Boolean),rel=[...new Set([...(direct[concept]||[]),...near])].slice(0,4),variant=Number(q.get('variant')||0),rot=rel.slice(variant).concat(rel.slice(0,variant));const steps=[concept,aid,...rot.slice(0,2)],w=900,h=250,boxes=steps.map((s,i)=>{const x=22+i*205,fill=i===0?'#dcecff':i===steps.length-1?'#dff6e5':'#eee7ff';return `<g><rect x="${x}" y="86" width="170" height="76" rx="16" fill="${fill}" stroke="#3a74cf" stroke-width="2"/><text x="${x+85}" y="120" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#18375e">${s}</text>${i<steps.length-1?`<path d="M ${x+170} 124 L ${x+200} 124" stroke="#2876d2" stroke-width="4" marker-end="url(#a)"/>`:''}</g>`}).join(''),svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${concept} mapped visual"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2876d2"/></marker></defs><text x="22" y="40" font-family="system-ui" font-size="21" font-weight="800" fill="#142d52">${concept}: ${aid}</text><text x="22" y="63" font-family="system-ui" font-size="13" fill="#49617f">Current proposed concept-specific route from the audit.</text>${boxes}</svg>`;document.getElementById('app').innerHTML=`<h1>${concept}</h1><p class="tiny"><b>Visual selected:</b> ${aid}</p><div style="overflow-x:auto">${svg}</div><p><b>Reference:</b> <a target="_blank" rel="noopener" href="${sources[domain][1]}">${sources[domain][0]} ↗</a></p>`});
</script></body></html>
